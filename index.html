<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Roulette - Clickable Multi-Bet Fixed</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a1d, #3e3e42);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; }
  #balance { font-weight: bold; }
  #roulette-container { display: flex; justify-content: center; margin-top: 20px; }
  #table-wrapper { display: flex; background: #2b2b2e; padding: 15px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5); align-items: flex-start; }
  #zero-column { display: flex; flex-direction: column; margin-right: 5px; }
  #zero-cell { width: 60px; height: 200px; background: green; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; border: 2px solid #333; cursor: pointer; }
  #number-grid { display: grid; grid-template-columns: repeat(12, 60px); grid-template-rows: repeat(3, 60px); gap: 5px; }
  .cell { width: 60px; height: 60px; border-radius: 5px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; font-size: 18px; transition: all 0.3s; border: 2px solid #333; }
  .green { background: green; }
  .red { background: red; }
  .black { background: black; }
  .highlight { box-shadow: 0 0 15px gold; transform: scale(1.2); }
  #controls { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
  input, button { padding: 8px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; cursor: pointer; }
  button { background: #f39c12; color: white; }
  button:hover { background: #e67e22; }
  #bet-buttons { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .bet-btn { padding: 8px 12px; border-radius: 5px; border: none; cursor: pointer; background: #3498db; color: white; font-weight: bold; }
  .bet-btn.active { border: 2px solid gold; }
  .cell.active-bet { border: 2px solid gold; }
  #zero-cell.active-bet { border: 2px solid gold; }
  .bet-btn:hover { background: #2980b9; }
</style>
</head>
<body>

<h1>🎡 Classic Roulette</h1>
<p>Balance: $<span id="balance">1000</span></p>

<div id="roulette-container">
  <div id="table-wrapper">
    <div id="zero-column">
      <div id="zero-cell">0</div>
    </div>
    <div id="number-grid"></div>
  </div>
</div>

<div id="controls">
  <label>Bet Amount:
    <input type="number" id="betAmount" min="1" value="10">
  </label>
  <button id="spinBtn">Spin</button>
  <p id="result" style="margin-top:10px;"></p>
</div>

<div id="win-popup" style="display:none; 
    position: fixed; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%);
    background: #2ecc71; 
    color: white; 
    padding: 20px 30px; 
    border-radius: 12px; 
    font-weight: bold; 
    box-shadow: 0 0 15px rgba(0,0,0,0.5); 
    z-index: 1000; 
    font-size: 22px;
    text-align: center;">
</div>



<div id="bet-buttons">
  <button class="bet-btn" data-bet="red">Red</button>
  <button class="bet-btn" data-bet="black">Black</button>
  <button class="bet-btn" data-bet="odd">Odd</button>
  <button class="bet-btn" data-bet="even">Even</button>
  <button class="bet-btn" data-bet="low">1-18</button>
  <button class="bet-btn" data-bet="high">19-36</button>
  <button class="bet-btn" data-bet="dozen1">1-12</button>
  <button class="bet-btn" data-bet="dozen2">13-24</button>
  <button class="bet-btn" data-bet="dozen3">25-36</button>
  <button class="bet-btn" data-bet="column1">Column 1</button>
  <button class="bet-btn" data-bet="column2">Column 2</button>
  <button class="bet-btn" data-bet="column3">Column 3</button>
  <button class="bet-btn" data-bet="voisins">Voisins du zéro</button>
</div>

<script>
// Roulette numbers and voisins
const rouletteNumbers = [
  {number:1,color:'red'},{number:2,color:'black'},{number:3,color:'red'},
  {number:4,color:'black'},{number:5,color:'red'},{number:6,color:'black'},
  {number:7,color:'red'},{number:8,color:'black'},{number:9,color:'red'},
  {number:10,color:'black'},{number:11,color:'black'},{number:12,color:'red'},
  {number:13,color:'black'},{number:14,color:'red'},{number:15,color:'black'},
  {number:16,color:'red'},{number:17,color:'black'},{number:18,color:'red'},
  {number:19,color:'red'},{number:20,color:'black'},{number:21,color:'red'},
  {number:22,color:'black'},{number:23,color:'red'},{number:24,color:'black'},
  {number:25,color:'red'},{number:26,color:'black'},{number:27,color:'red'},
  {number:28,color:'black'},{number:29,color:'black'},{number:30,color:'red'},
  {number:31,color:'black'},{number:32,color:'red'},{number:33,color:'black'},
  {number:34,color:'red'},{number:35,color:'black'},{number:36,color:'red'}
];
const voisinsNumbers = [22,18,29,7,28,12,35,3,26,0,32,15,19,4,21,2,25];
//THIS IS THE POP UP FOR WINNING
function showWinPopup(amount) {
  const popup = document.getElementById('win-popup');
  popup.textContent = `🎉 You won $${amount.toFixed(2)}!`;
  popup.style.display = 'block';
  
  // Animate fade-out after 2.5 seconds
  setTimeout(() => {
    popup.style.transition = "opacity 0.5s";
    popup.style.opacity = 0;
    setTimeout(() => {
      popup.style.display = 'none';
      popup.style.opacity = 1; // reset for next time
      popup.style.transition = "";
    }, 500);
  }, 2500);
}

// Generate number grid
const numberGrid = document.getElementById('number-grid');
rouletteNumbers.forEach(n=>{
  const cell = document.createElement('div');
  cell.classList.add('cell', n.color);
  cell.textContent = n.number;
  numberGrid.appendChild(cell);
  cell.addEventListener('click', ()=>{ toggleNumberBet(n.number, parseFloat(betAmountEl.value), cell); });
});

// Zero cell
const zeroCell = document.getElementById('zero-cell');
zeroCell.addEventListener('click', ()=>{ toggleNumberBet(0, parseFloat(betAmountEl.value), zeroCell); });

// Balance and bets
let balance = 1000;
const balanceEl = document.getElementById('balance');
const betAmountEl = document.getElementById('betAmount');
const spinBtn = document.getElementById('spinBtn');
const resultEl = document.getElementById('result');
let activeBets = []; // {type:'number'/'red'/etc, amount:number, number:0 for numbers}

// Bet buttons toggle
document.querySelectorAll('.bet-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const type = btn.dataset.bet;
    const existing = activeBets.find(b=>b.type===type);
    if(existing){ activeBets = activeBets.filter(b=>b.type!==type); btn.classList.remove('active'); }
    else { activeBets.push({ type, amount: parseFloat(betAmountEl.value), number: 0 }); btn.classList.add('active'); }
  });
});

// Toggle number bets (multi-number enabled)
function toggleNumberBet(number, amount, cell){
  const existing = activeBets.find(b=>b.type==='number' && b.number===number);
  if(existing){ 
    activeBets = activeBets.filter(b=>!(b.type==='number' && b.number===number)); 
    cell.classList.remove('active-bet'); 
  } else { 
    activeBets.push({type:'number',number,amount:amount}); 
    cell.classList.add('active-bet'); 
  }
}

// Spin logic
spinBtn.addEventListener('click', ()=>{
  if(activeBets.length===0){ alert("Select at least one bet!"); return; }
  
  // Clone bets and ensure valid numeric amounts
  const spinBets = activeBets.map(b => ({
    ...b,
    amount: parseFloat(b.amount) || parseFloat(betAmountEl.value) || 0
  }));

  let totalBet = spinBets.reduce((sum,b)=>sum + b.amount, 0);
  if(totalBet>balance){ alert("Not enough balance!"); return; }
  balance -= totalBet;
  balanceEl.textContent = balance;

  const allNumbers = [{number:0,color:'green'}, ...rouletteNumbers];
  const winningIndex = Math.floor(Math.random()*allNumbers.length);
  const winningNumberObj = allNumbers[winningIndex];

  // Animate spin
  const numberCells = Array.from(document.querySelectorAll('.cell'));
  const cells = [{el: zeroCell, number:0}, ...numberCells.map(c=>({el:c, number: parseInt(c.textContent)}))];

  animateSpin(winningNumberObj.number, cells, ()=>{
    let totalWin=0;
    spinBets.forEach(bet=>{ totalWin+=calculateWin(bet, winningNumberObj.number); });
    balance += totalWin;
    balanceEl.textContent = balance;
    resultEl.textContent = `Winning Number: ${winningNumberObj.number}`;

    if (totalWin>0) {
        showWinPopup(totalWin); //this might be the green ?? 
    }
});

});
document.addEventListener('keydown', (event) => {
  if(event.code === 'Space' && event.target.tagName !== 'INPUT' && event.target.tagName !== 'TEXTAREA'){
      event.preventDefault(); 
      spinBtn.click();
  }
});
// Animate spin
function animateSpin(winningNumber, cells, callback){
  cells.forEach(c=>c.el.classList.remove('highlight'));
  let i = 0;
  const winningIndex = cells.findIndex(c=>c.number===winningNumber);
  const totalIterations = 30 + winningIndex;

  const interval = setInterval(()=>{
    cells.forEach(c=>c.el.classList.remove('highlight'));
    const index = i % cells.length;
    cells[index].el.classList.add('highlight');
    i++;
    if(i > totalIterations){
      clearInterval(interval);
      cells.forEach(c=>c.el.classList.remove('highlight'));
      cells[winningIndex].el.classList.add('highlight');
      if(callback) callback();
    }
  }, 80);
}

// Calculate winnings
function calculateWin(bet, winningNumber){
  let payout = 0;
  switch(bet.type){
    case 'number': 
      if(winningNumber === bet.number) payout = bet.amount * 36; // 35:1 odds + original bet
      break;
    case 'red': 
      if([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(winningNumber)) payout = bet.amount * 2; // 1:1 + original
      break;
    case 'black': 
      if([2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35].includes(winningNumber)) payout = bet.amount * 2; 
      break;
    case 'odd': 
      if(winningNumber!==0 && winningNumber%2===1) payout = bet.amount * 2; 
      break;
    case 'even': 
      if(winningNumber!==0 && winningNumber%2===0) payout = bet.amount * 2; 
      break;
    case 'low': 
      if(winningNumber>=1 && winningNumber<=18) payout = bet.amount * 2; 
      break;
    case 'high': 
      if(winningNumber>=19 && winningNumber<=36) payout = bet.amount * 2; 
      break;
    case 'dozen1': 
      if(winningNumber>=1 && winningNumber<=12) payout = bet.amount * 3; 
      break;
    case 'dozen2': 
      if(winningNumber>=13 && winningNumber<=24) payout = bet.amount * 3; 
      break;
    case 'dozen3': 
      if(winningNumber>=25 && winningNumber<=36) payout = bet.amount * 3; 
      break;
    case 'column1': 
      if([1,4,7,10,13,16,19,22,25,28,31,34].includes(winningNumber)) payout = bet.amount * 3; 
      break;
    case 'column2': 
      if([2,5,8,11,14,17,20,23,26,29,32,35].includes(winningNumber)) payout = bet.amount * 3; 
      break;
    case 'column3': 
      if([3,6,9,12,15,18,21,24,27,30,33,36].includes(winningNumber)) payout = bet.amount * 3; 
      break;
    case 'voisins': 
      if(voisinsNumbers.includes(winningNumber)) payout = bet.amount * 17/voisinsNumbers.length * voisinsNumbers.length; // simplified
      break;
  }
  return payout;
}

</script>

</body>
</html>
